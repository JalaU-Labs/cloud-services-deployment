name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.23"
      - name: Set up Python
        run: uv python install 3.14.6
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.23"
      - name: Set up Python
        run: uv python install 3.14.6
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Test
        run: uv run pytest
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: htmlcov/